<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>Letter Swap</title>
    <style>
      
      :root { --bg:#ffff; --tile:#f5e9c8; --ink:#2a2112; --accent:#375fa3; --t:60px; }
      
      * { box-sizing:border-box;
	  user-select:none;
	  -webkit-user-select:none;
	  -webkit-tap-highlight-color:transparent;
	}
      
      body { margin:0;
	     min-height:100vh;
	     display:flex;
	     flex-direction:column;
	     align-items:center;
             background:var(--bg);
	     color:#000;
	     font-family:system-ui,sans-serif;
	     padding:16px;
	   }
      
      h1 { margin:8px 0 2px;
	   letter-spacing:2px;
	 }
      
      #seedLabel { color:var(--accent); }
      
      #stats { display:flex;
	       gap:22px;
	       margin:8px 0 6px;
	       font-size:14px;
	     }
      
      #stats b { color:var(--accent);
		 font-size:22px;
		 display:block;
		 text-align:center;
	       }
      
      #info { font-size:13px;
	      opacity:.75;
	      margin-bottom:10px;
	      text-align:center;
	      max-width:420px;
	    }

      #wrap { display:flex;
	      align-items:center;
	      justify-content:center;
	    }
      
      #board { position:relative;
	       transition:width .45s ease, height .45s ease;
	     }

      .tile { position:absolute;
	      left:0; top:0; width:var(--t);
	      height:var(--t);
              background:var(--tile);
	      color:var(--ink);
	      border-radius:10px;
              display:flex;
	      align-items:center;
	      justify-content:center;
              font-size:calc(var(--t) * .5);
	      font-weight:800;
	      cursor:grab;
	      touch-action:none;	      
              transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .3s, background .2s;
	    }
      
      .tile small { position:absolute;
		    right:5px;
		    bottom:2px;
		    font-size:calc(var(--t) * .18);
		    font-weight:600;
		  }
      
      .tile.drag { transition:opacity .3s, background .2s; z-index:10;
		   cursor:grabbing;
		   box-shadow:0 8px 18px rgba(0,0,0,.45);
		   background:var(--accent);
		 }
      
      .tile.pop  { background:#6be38a; }
      .tile.lose { background:#ff6b6b; color:#fff; }

      .float { position:absolute;
	       left:0;
	       top:0;
	       width:var(--t);
	       text-align:center;
	       color:#ff6b6b;
               font-weight:800;
	       font-size:20px;
	       pointer-events:none;
	       z-index:20;
               animation:floatUp .9s ease-out forwards;
	     }
      
      @keyframes floatUp {
	  from { opacity:1; margin-top:0; }
	  to { opacity:0; margin-top:-44px; }
      }
      
      #score.hit { color:#ff6b6b; }

      #msg { min-height:28px;
	     margin:12px 0 8px;
	     color:var(--accent);
	     font-weight:700;
	     text-align:center;
	     max-width:420px;
	   }
      
      button, input, select { border-radius:8px;
			      border:0;
			      padding:10px 14px;
			      font-size:14px;
			      margin:3px;
			    }
      
      button { background:var(--accent);
	       font-weight:700;
	       cursor:pointer;
	       color: #fff;
	     }
      
      input  { width:140px;
	       user-select:text;
	       -webkit-user-select:text;
	       background-color: #f0f0f0;
	     }

      #sizeSel { background-color: #f0f0f0; }
      
      label  { font-size:14px; }
      
      #foot { font-size:12px;
	      opacity:.6;
	      margin-top:12px;
	      text-align:center;
	      max-width:420px;
	    }
      
    </style>
  </head>
  <body>
    
    <h1>Letter Swap</h1>
    
    <div>Seed: <b id="seedLabel"></b></div>
    
    <div id="stats">
      <div>Score<b id="score">0</b></div>
      <div>Best<b id="best">0</b></div>
      <div>Moves<b id="moves">0</b></div>
    </div>
    
    <div id="info"></div>
    <div id="wrap"><div id="board"></div></div>
    <div id="msg">Loading word list…</div>
    
    <div>
      <button id="dailyBtn">Daily</button>
      <button id="randomBtn">New random</button>
      <button id="retryBtn">Retry</button>
      <button id="shareBtn">Copy result</button>
    </div>
    
    <div>
      <label>Board size <select id="sizeSel"></select></label>
    </div>
    
    <div>
      <input id="seedInput" placeholder="enter a seed">
      <button id="goBtn">Play seed</button>
    </div>
    <div id="foot"></div>

    <script>
      
      let N = 7;
      const MAX_N = 9; 
      const MIN_LEN = 2;
      const MAX_SWAPS_PER_TURN = 2;
      const ADJACENT_ONLY = false;
      const GAP = 6;
      const MOVE_COST = 10;
      const LEFTOVER_PENALTY = 5;
      const CLEAR_BONUS = 10;

      const VAL = {A:1,B:3,C:3,D:2,E:1,F:4,G:2,H:4,I:1,J:8,K:5,L:1,M:3,N:1,O:1,P:3,Q:10,R:1,S:1,T:1,U:1,V:4,W:4,X:8,Y:4,Z:10};
      const FALLBACK = ("an at be by do go he if in is it me my no of on or so to up us we " +
			"the and for are but not you all any can had her was one our out day get has him his how man new now old see two way who boy " +
			"did its let put say she too use cat dog sun run red big top hot cut sit eat fun map pen bag bed box car cup hat key leg jam " +
			"cats dogs love time word game play tile swap line made list home read open down text tree star moon fish bird rain snow " +
			"write stone plant light water world sound plane house green brown black white train smile dream happy sweet about other which their " +
			"there would could these three think place right still small every great where after first " +
			"planet garden silver bridge monkey wonder rainbow dolphin teacher journey picture morning kitchen blanket mystery").split(" ");

      let dict = new Set(FALLBACK), online = false;
      let seed = "", rng = Math.random, nextId = 0;
      let grid = [];
      const els = new Map();
      let T = 60, step = 66;
      let drag = null, busy = false, over = false;
      let score = 0, moves = 0, best = 0;
      let par = 0, turnCount = 0;

      const $ = id => document.getElementById(id);
      const board = $("board"), wrap = $("wrap"), sizeSel = $("sizeSel");
      const sleep = ms => new Promise(r => setTimeout(r, ms));
      const say = t => $("msg").textContent = t;

      function xmur3(str) {
	  let h = 1779033703 ^ str.length;
	  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
	  return () => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; };
      }
      function mulberry32(a) {
	  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
			 t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      }
      function dailySeed() {
	  const d = new Date();
	  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
      }
      const randomSeed = () => Math.random().toString(36).slice(2, 8);


      const bestKey = () => "dict-v1:" + N + ":" + seed;
      function loadBest() { try { return +localStorage.getItem(bestKey()) || 0; } catch (e) { return 0; } }
      function addScore(n) { score += n; }

      function finish() {
	  if (score > best) { best = score; try { localStorage.setItem(bestKey(), best); } catch (e) {} }
	  hud();
      }

      const DICT_KEY = "dict-v1";
      const DICT_URL =
	    "https://raw.githubusercontent.com/powerlanguage/word-lists/refs/heads/master/1000-most-common-words.txt";

      function addWords(list) {
	  list.forEach(w => {
	      if (w) dict.add(w);
	  });
      }

      async function loadDict() {
	  let words = [];
	  
	  try {
	      const res = await fetch(DICT_URL);

	      if (!res.ok) {
		  throw new Error(`HTTP ${res.status}`);
	      }

	      words = (await res.text())
		  .toLowerCase()
		  .split(/\s+/)
		  .map(w => w.trim())
		  .filter(w =>
		      w.length >= 2 &&
			  w.length <= MAX_N &&
			  /^[a-z]+$/.test(w)
		  );

	      if (words.length < 900) {
		  throw new Error(`Only found ${words.length} valid words`);
	      }

	      addWords(words);
	      online = true;

	      try {
		  localStorage.setItem(DICT_KEY, words.join(" "));
	      } catch (e) {
		  console.warn("Could not cache dictionary:", e);
	      }

	      $("foot").textContent = `Word list: ${dict.size} words.`;
	      return;

	  } catch (e) {
	      console.error("Dictionary download failed:", e);
	  }

	  try {
	      const saved = localStorage.getItem(DICT_KEY);

	      if (saved) {
		  words = saved.split(/\s+/)
		      .map(w => w.toLowerCase())
		      .filter(w =>
			  w.length >= 2 &&
			      w.length <= MAX_N &&
			      /^[a-z]+$/.test(w)
		      );

		  if (words.length >= 1000) {
		      addWords(words);
		      online = true;
		      $("foot").textContent =
			  `Word list: ${dict.size} words (cached copy).`;
		      return;
		  }
	      }
	  } catch (e) {
	      console.warn("Could not read cached dictionary:", e);
	  }

	  online = false;
	  $("foot").textContent =
	      `Offline: using the small built-in list (${dict.size} words).`;
      }

      function findLines() {
	  const hits = [], R = grid.length, C = R ? grid[0].length : 0;
	  if (C >= MIN_LEN)
	      grid.forEach((row, i) => {
		  const w = row.map(t => t.ch).join("");
		  if (dict.has(w.toLowerCase())) hits.push({ type: "row", i, word: w });
	      });
	  if (R >= MIN_LEN)
	      for (let c = 0; c < C; c++) {
		  const w = grid.map(row => row[c].ch).join("");
		  if (dict.has(w.toLowerCase())) hits.push({ type: "col", i: c, word: w });
	      }
	  return hits;
      }

      function canMakeWord() {
	  const R = grid.length, C = R ? grid[0].length : 0;
	  if (!R) return false;
	  const lens = new Set();
	  if (C >= MIN_LEN) lens.add(C);
	  if (R >= MIN_LEN) lens.add(R);
	  if (!lens.size) return false;

	  const have = {};
	  grid.forEach(row => row.forEach(t => { const k = t.ch.toLowerCase(); have[k] = (have[k] || 0) + 1; }));

	  for (const w of dict) {
	      if (!lens.has(w.length)) continue;
	      const need = {};
	      let ok = true;
	      for (const ch of w) {
		  need[ch] = (need[ch] || 0) + 1;
		  if (need[ch] > (have[ch] || 0)) { ok = false; break; }
	      }
	      if (ok) return true;
	  }
	  return false;
      }

      const xf = (r, c, s = 1) => `translate(${c * step}px, ${r * step}px) scale(${s})`;

      function layout() {
	  const R = grid.length, C = R ? grid[0].length : 0;
	  board.style.width  = Math.max(0, C * step - GAP) + "px";
	  board.style.height = Math.max(0, R * step - GAP) + "px";
	  grid.forEach((row, r) => row.forEach((t, c) => { els.get(t.id).style.transform = xf(r, c); }));
	  $("info").textContent = R
	      ? `Swap letters to make words. Each swap costs ${MOVE_COST} points!`
	      : "Board cleared!";
      }
      
      function hud() {
	  $("score").textContent = score;
	  $("best").textContent = Math.max(best, score);
	  $("moves").textContent = moves;
	  $("seedLabel").textContent = seed;
      }
      function sizeBoard() {
	  const avail = Math.min(window.innerWidth * 0.92, 420);
	  T = Math.floor((avail - GAP * (N - 1)) / N);
	  step = T + GAP;
	  document.documentElement.style.setProperty("--t", T + "px");
	  wrap.style.width = wrap.style.height = (N * step - GAP) + "px";
      }
      window.addEventListener("resize", () => { sizeBoard(); layout(); });

      function makeEl(t, r, c) {
	  const el = document.createElement("div");
	  el.className = "tile";
	  el.dataset.id = t.id;
	  el.innerHTML = `${t.ch}<small>${VAL[t.ch]}</small>`;
	  el.style.transform = xf(r, c);
	  el.addEventListener("pointerdown", onDown);
	  el.addEventListener("pointermove", onMove);
	  el.addEventListener("pointerup", onUp);
	  el.addEventListener("pointercancel", onUp);
	  board.appendChild(el);
	  els.set(t.id, el);
      }

      function posOf(id) {
	  for (let r = 0; r < grid.length; r++)
	      for (let c = 0; c < grid[r].length; c++) if (grid[r][c].id === id) return [r, c];
	  return null;
      }
      const allowed = (r1, c1, r2, c2) => !ADJACENT_ONLY || Math.abs(r1 - r2) + Math.abs(c1 - c2) === 1;

      function onDown(e) {
	  if (busy || over || drag) return;
	  const el = e.currentTarget, id = +el.dataset.id;
	  const [r, c] = posOf(id);
	  const rect = board.getBoundingClientRect();
	  drag = { el, id, r, c, dx: e.clientX - rect.left - c * step, dy: e.clientY - rect.top - r * step, hover: null };
	  el.classList.add("drag");
	  el.setPointerCapture(e.pointerId); 
	  e.preventDefault();
      }

      function setHover(target) {
	  const cur = drag.hover;
	  if (cur && target && cur[0] === target[0] && cur[1] === target[1]) return;
	  if (cur) els.get(grid[cur[0]][cur[1]].id).style.transform = xf(cur[0], cur[1]);
	  if (target) els.get(grid[target[0]][target[1]].id).style.transform = xf(drag.r, drag.c);
	  drag.hover = target;
      }

      function onMove(e) {
	  if (!drag || e.currentTarget !== drag.el) return;
	  const rect = board.getBoundingClientRect();
	  const x = e.clientX - rect.left, y = e.clientY - rect.top;
	  drag.el.style.transform = `translate(${x - drag.dx}px, ${y - drag.dy}px) scale(1.08)`;
	  const c = Math.floor(x / step), r = Math.floor(y / step);
	  const R = grid.length, C = grid[0].length;
	  const ok = r >= 0 && r < R && c >= 0 && c < C && !(r === drag.r && c === drag.c) && allowed(drag.r, drag.c, r, c);
	  setHover(ok ? [r, c] : null);
      }

      async function onUp(e) {
	  if (!drag || e.currentTarget !== drag.el) return;
	  const d = drag;
	  if (e.type === "pointercancel") setHover(null);
	  drag = null;
	  d.el.classList.remove("drag");
	  if (d.hover) {
	      const [r, c] = d.hover;
	      [grid[d.r][d.c], grid[r][c]] = [grid[r][c], grid[d.r][d.c]];
	      moves++;
	      addScore(-MOVE_COST);
	      busy = true;
	      hud();
	      layout();
	      await sleep(300);
	      await resolve();
	      await checkEnd();
	      busy = false;
	      hud();
	  } else {
	      layout();
	  }
      }

      async function resolve() {
	  let chain = 0;
	  while (grid.length) {
	      const hits = findLines();
	      if (!hits.length) break;
	      chain++;
	      let gained = 0;
	      const rowsOut = new Set(), colsOut = new Set();
	      for (const h of hits) {
		  gained += [...h.word].reduce((s, ch) => s + VAL[ch], 0) * Math.max(1, h.word.length - 2) * chain;
		  (h.type === "row" ? rowsOut : colsOut).add(h.i);
	      }
	      addScore(gained);
	      say(`${hits.map(h => h.word).join(", ")}  +${gained}` + (chain > 1 ? `  (chain ×${chain})` : ""));
	      hud();

	      const R = grid.length, C = grid[0].length, doomed = [];
	      for (let r = 0; r < R; r++) for (let c = 0; c < C; c++)
		  if (rowsOut.has(r) || colsOut.has(c)) doomed.push({ t: grid[r][c], r, c });

	      doomed.forEach(d => els.get(d.t.id).classList.add("pop"));
	      await sleep(450);
	      doomed.forEach(d => {
		  const el = els.get(d.t.id);
		  el.style.opacity = 0;
		  el.style.transform = xf(d.r, d.c, 0.3);
	      });
	      await sleep(300);
	      doomed.forEach(d => { els.get(d.t.id).remove(); els.delete(d.t.id); });
	      
	      const ng = [];
	      for (let r = 0; r < R; r++) {
		  if (rowsOut.has(r)) continue;
		  const row = grid[r].filter((_, c) => !colsOut.has(c));
		  if (row.length) ng.push(row);
	      }
	      grid = ng;
	      layout();
	      await sleep(500);
	  }
	  if (!grid.length) {
	      addScore(CLEAR_BONUS);
	      say(`Board cleared! Bonus +${CLEAR_BONUS}. Final score: ${score}`);
	  }
      }

      async function checkEnd() {
	  if (!grid.length) { over = true; finish(); return; }
	  if (!canMakeWord()) return endGame("No more words can be made!");
      }

      async function endGame(reason) {
	  over = true;
	  const left = [];
	  grid.forEach((row, r) => row.forEach((t, c) => left.push({ t, r, c })));
	  say(`${reason} Leftover letters cost you points :c`);
	  await sleep(700);

	  let lost = 0;
	  for (const { t, r, c } of left) {
	      const cost = VAL[t.ch] * LEFTOVER_PENALTY;
	      score -= cost; lost += cost;

	      els.get(t.id).classList.add("lose");
	      const f = document.createElement("div");
	      f.className = "float";
	      f.textContent = "-" + cost;
	      f.style.transform = `translate(${c * step}px, ${r * step}px)`;
	      board.appendChild(f);
	      setTimeout(() => f.remove(), 1000);

	      const s = $("score");
	      s.classList.add("hit"); setTimeout(() => s.classList.remove("hit"), 120);
	      hud();
	      await sleep(130);
	  }

	  await sleep(400);
	  finish();
	  say(`${reason} Leftovers cost ${lost}. Final score: ${score} in ${moves} moves`);
      }

      /* Puzzle gen */

      const isWord = s => dict.has(s.toLowerCase());

      function hitsOf(g) {
	  const R = g.length, C = R ? g[0].length : 0, rows = [], cols = [];
	  if (C >= MIN_LEN) g.forEach((row, r) => { if (isWord(row.join(""))) rows.push(r); });
	  if (R >= MIN_LEN)
	      for (let c = 0; c < C; c++) if (isWord(g.map(row => row[c]).join(""))) cols.push(c);
	  return { rows, cols };
      }
      const hitCount = g => { const h = hitsOf(g); return h.rows.length + h.cols.length; };

      let byLen = null;
      function wordsOfLen(L) {
	  if (!byLen) {
	      byLen = {};
	      [...dict].sort().forEach(w => (byLen[w.length] ||= []).push(w.toUpperCase()));
	  }
	  return byLen[L] || [];
      }

      function maxSupported() {
	  let n = MIN_LEN;
	  while (n < MAX_N && wordsOfLen(n + 1).length >= 3) n++;
	  return n;
      }
      function fillSizes() {
	  const top = maxSupported();
	  sizeSel.innerHTML = "";
	  for (let n = 3; n <= top; n++) sizeSel.add(new Option(`${n} × ${n}`, n));
	  N = Math.min(Math.max(N, 3), top);
	  sizeSel.value = N;
      }

      function insertLine(g, w, dir, at) {
	  const out = g.map(r => [...r]);
	  if (dir === "R") out.splice(at, 0, w.split(""));
	  else out.forEach((row, k) => row.splice(at, 0, w[k]));
	  return out;
      }

      function applySwaps(g, swaps) {
	  const out = g.map(r => [...r]);
	  swaps.forEach(([[r1, c1], [r2, c2]]) => { [out[r1][c1], out[r2][c2]] = [out[r2][c2], out[r1][c1]]; });
	  return out;
      }

      function pickSwaps(g, lineCells, d) {
	  const cells = g.flatMap((row, r) => row.map((_, c) => [r, c]));
	  const used = new Set(), swaps = [], key = ([r, c]) => r * 16 + c;
	  for (let tries = 0; swaps.length < d && tries < 100; tries++) {
	      const a = lineCells[Math.floor(rng() * lineCells.length)];
	      const b = cells[Math.floor(rng() * cells.length)];
	      if (key(a) === key(b) || used.has(key(a)) || used.has(key(b))) continue;
	      if (g[a[0]][a[1]] === g[b[0]][b[1]]) continue;
	      used.add(key(a)); used.add(key(b));
	      swaps.push([a, b]);
	  }
	  return swaps.length === d ? swaps : null;
      }

      function makePuzzle() {
	  const used = new Set();
	  const pickWord = L => {
	      const all = wordsOfLen(L), fresh = all.filter(w => !used.has(w)), from = fresh.length ? fresh : all;
	      return from.length ? from[Math.floor(rng() * from.length)] : null;
	  };

	  let B = [], r = 0, c = 0, total = 0, turns = 0;
	  while (r < N || c < N) {
	      let done = false;
	      for (let tries = 0; tries < 60 && !done; tries++) {

		  let dir, len;
		  if (!r) {
		      
		      dir = rng() < 0.5 ? "R" : "C";
		      len = MIN_LEN;
		      
		  } else {
		      
		      const opts = [];
		      if (r < N && c >= MIN_LEN) opts.push("R");
		      if (c < N && r >= MIN_LEN) opts.push("C");
		      if (!opts.length) return null;
		      dir = opts[Math.floor(rng() * opts.length)];
		      len = dir === "R" ? c : r;
		      
		  }
		  const w = pickWord(len);
		  if (!w) return null;
		  const at = r ? Math.floor(rng() * ((dir === "R" ? r : c) + 1)) : 0;

		  const Bp = !r ? (dir === "R" ? [w.split("")] : w.split("").map(ch => [ch]))
			: insertLine(B, w, dir, at);

		  const h = hitsOf(Bp);
		  
		  const exact = dir === "R" ? (h.rows.length === 1 && h.rows[0] === at && !h.cols.length)
                        : (h.cols.length === 1 && h.cols[0] === at && !h.rows.length);
		  
		  if (!exact) continue;

		  const lineCells = dir === "R" ? Bp[at].map((_, k) => [at, k]) : Bp.map((_, k) => [k, at]);
		  const tiles = Bp.length * Bp[0].length;
		  const d = Math.min(1 + Math.floor(rng() * MAX_SWAPS_PER_TURN), Math.floor(tiles / 2));
		  const swaps = pickSwaps(Bp, lineCells, d);
		  if (!swaps) continue;

		  let clean = true;
		  for (let m = 1; m < (1 << d) && clean; m++)
		      if (hitCount(applySwaps(Bp, swaps.filter((_, i) => (m >> i) & 1)))) clean = false;
		  if (!clean) continue;

		  const next = applySwaps(Bp, swaps);
		  if (d === 2) continue;

		  B = next; used.add(w); r = B.length; c = B[0].length; total += d; turns++;
		  done = true;
	      }
	      
	      if (!done) return null;
	      
	  }
	  
	  return { board: B, par: total, turns };
	  
      }

      function buildGrid() {
	  
	  for (let attempt = 0; attempt < 400; attempt++) {
	      const p = makePuzzle();
	      if (!p) continue;
	      nextId = 0;
	      grid = p.board.map(row => row.map(ch => ({ id: nextId++, ch })));
	      par = p.par; turnCount = p.turns;
	      return true;
	  }
	  
	  return false;
      }

      function newGame(s, n = +sizeSel.value || N) {
	  N = n; sizeBoard();
	  seed = (s || "").trim() || dailySeed();
	  rng = mulberry32(xmur3(seed + "~" + N)());
	  if (!buildGrid()) { say("This is awkward"); return; }
	  score = 0; moves = 0; busy = false; over = false; drag = null;
	  best = loadBest();
	  board.innerHTML = ""; els.clear();
	  board.style.transition = "none";
	  grid.forEach((row, r) => row.forEach((t, c) => makeEl(t, r, c)));
	  layout();
	  void board.offsetWidth;
	  board.style.transition = "";
	  try { history.replaceState(null, "", "#" + encodeURIComponent(seed) + "~" + N); } catch (e) {}
	  say(`Drag a tile onto another to swap.`);
	  hud();
      }

      const start = s => { if (!busy) newGame(s); };
      $("dailyBtn").onclick  = () => start(dailySeed());
      $("randomBtn").onclick = () => start(randomSeed());
      $("retryBtn").onclick  = () => start(seed);
      $("goBtn").onclick     = () => start($("seedInput").value);
      $("seedInput").onkeydown = e => { if (e.key === "Enter") start($("seedInput").value); };
      $("shareBtn").onclick  = async () => {
	  const text = `Gram Jam ${seed} (${N}×${N}): ${score} pts in ${moves} moves`;
	  try { await navigator.clipboard.writeText(text); say("copied result!"); } catch (e) { say(text); }
      };

      sizeBoard();
      loadDict().then(() => {
	  fillSizes();
	  const [s, n] = location.hash.slice(1).split("~");
	  if (+n >= 3 && [...sizeSel.options].some(o => +o.value === +n)) sizeSel.value = +n;
	  newGame(decodeURIComponent(s || "") || dailySeed());
      });
      
    </script>
  </body>
</html>
